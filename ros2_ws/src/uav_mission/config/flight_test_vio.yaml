# UAV-ND first autonomous cuVSLAM flight test (indoor). Overrides mission.yaml defaults.
#   ros2 launch uav_mission mission.launch.py bridge:=true \
#        params:=$(ros2 pkg prefix uav_mission)/share/uav_mission/config/flight_test_vio.yaml
# Order: hover first; square only if hover was clean; sweep only if square was clean (edit `profile`).
# square / sweep geometry is relative to the TAKEOFF POSE (forward / left of where the drone armed).
uav_mission:
  ros__parameters:
    profile: hover            # hover | square | sweep (no detector: flies every lane, then returns)
    takeoff_alt: 1.5          # m: low, inside the ARK Flow rangefinder's good range
    hover_s: 20.0
    square_side: 1.0          # m, forward then left of the takeoff pose (negative = mirrored)
    path_speed: 0.3           # m/s
    # sweep: small lawnmower without CV, then fly back to the start and land (no RTL)
    sweep_end: return
    area_x_min: 0.5           # m forward of the takeoff point
    area_x_max: 2.5
    area_y_min: 0.0           # m left of the takeoff point (negative = right)
    area_y_max: 1.5
    lane_spacing: 0.75
    transit_speed: 0.3
    sweep_speed: 0.3
    stable_s: 2.0
    require_vio: true         # refuse to start unless VIO is healthy AND EKF is on source set 2
    min_start_battery: 0.6
    rtl_battery: 0.35
    time_limit_s: 120.0       # whole flight; then RTL (check RTL_ALT is set low on the Cube!)
    failsafe_hold_s: 3.0

    # tight safety box around the takeoff point
    max_alt: 2.5
    min_alt: 0.5
    max_radius: 3.5           # farthest sweep corner is 2.9 m from takeoff
    max_speed: 0.5
    max_vz: 0.3
