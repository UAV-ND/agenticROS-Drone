# UAV-ND VIO -> MAVROS bridge parameters (uav_vio vio_mavros_bridge node).
# Gate defaults were chosen from recorded cuVSLAM runs (Nov 3-4 2026): normal motion <= 0.5 m/s and
# <= 50 deg/s, tracking pose variance ~4e-5 m^2 (p99 ~4e-3), occlusion jumps 4-1100 m/s and up to
# 2300 deg/s with variance 0.03-240 m^2. Re-check max_speed against the AVC task's flight speeds.
vio_mavros_bridge:
  ros__parameters:
    input_topic: /visual_slam/tracking/odometry
    output_topic: /mavros/odometry/out
    frame_id: odom              # must match MAVROS (it looks up odom -> odom_ned)
    child_frame_id: base_link   # must match MAVROS (base_link -> base_link_frd)

    # D435i camera_link pose in base_link (FLU, metres / degrees). base_link = Cube Orange centre.
    # 2026-11-17 final mount: offset tape-measured by the team: 134 mm forward of the Cube centre,
    #   110 mm below it, centred left/right (assumed).
    #   Tilt from the D435i accelerometer (0.9 deg up, 0.5 deg roll) minus the Cube's own bench
    #   attitude from its log (0.3 deg nose up, 0.4 deg roll, same side): camera ~0.6 deg UP, roll ~0
    #   relative to the frame (IMU uncalibrated: +-1 deg).
    cam_x: 0.134
    cam_y: 0.0
    cam_z: -0.110
    cam_roll_deg: 0.0
    cam_pitch_down_deg: -0.6    # positive = lens tilted down (negative = up)
    cam_yaw_deg: 0.0

    # none:       world = body pose when cuVSLAM starts (drone must sit level then).
    # camera_imu: level the world with the D435i accel while still; also logs the measured tilt.
    level_mode: none
    imu_topic: /camera/camera/imu
    level_samples: 200

    max_rate_hz: 30.0

    # 7 m/s (was 4.0) so the fast square (up to 5 m/s, config square_10m_fast_vio.yaml) isn't read as a
    # tracking jump. The slowest jumps recorded were ~4 m/s, but they all came with pose variance
    # 0.03-240 m^2, which max_pos_var (0.02) still rejects.
    max_speed: 7.0              # m/s
    step_margin: 0.05           # m
    max_ang_rate_deg: 300.0     # deg/s
    ang_margin_deg: 3.0
    max_pos_var: 0.02           # m^2
    max_gap_s: 0.3
    recover_frames: 15
    predict_max_s: 0.5
    max_age_s: 0.25             # input older than this vs node clock is dropped
    min_pos_var: 0.0001
    min_rot_var: 0.0001
    min_vel_var: 0.001
